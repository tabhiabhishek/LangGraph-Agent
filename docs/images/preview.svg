<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- window -->
  <rect width="1280" height="760" rx="14" fill="#0f141a"/>
  <rect x="0.5" y="0.5" width="1279" height="759" rx="14" fill="none" stroke="#2a323d"/>
  <rect width="1280" height="40" rx="14" fill="#161c24"/>
  <rect y="26" width="1280" height="14" fill="#161c24"/>
  <circle cx="22" cy="20" r="6" fill="#ef4444"/><circle cx="42" cy="20" r="6" fill="#f59e0b"/><circle cx="62" cy="20" r="6" fill="#22c55e"/>
  <text x="640" y="25" text-anchor="middle" font-size="13" fill="#9ca3af">LangGraph Agent — localhost:8501</text>

  <!-- streamlit header -->
  <rect y="40" width="1280" height="46" fill="#121820"/>
  <line x1="0" y1="86" x2="1280" y2="86" stroke="#2a323d"/>
  <rect x="80" y="62" width="160" height="3" rx="1.5" fill="url(#accent)" opacity="0.8"/>
  <rect x="1084" y="52" width="124" height="24" rx="12" fill="#0f2a1c" stroke="#166534"/>
  <circle cx="1100" cy="64" r="4" fill="#22c55e"/>
  <text x="1152" y="69" text-anchor="middle" font-size="12" fill="#4ade80">llama3.2 · local</text>
  <circle cx="1232" cy="57" r="2" fill="#9ca3af"/><circle cx="1232" cy="64" r="2" fill="#9ca3af"/><circle cx="1232" cy="71" r="2" fill="#9ca3af"/>

  <!-- title -->
  <g>
    <rect x="96" y="114" width="40" height="34" rx="9" fill="#161c24" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="109" cy="131" r="4" fill="#38bdf8"/><circle cx="123" cy="131" r="4" fill="#38bdf8"/>
    <line x1="116" y1="114" x2="116" y2="106" stroke="#22c55e" stroke-width="2"/><circle cx="116" cy="104" r="3" fill="#22c55e"/>
  </g>
  <text x="152" y="142" font-size="34" font-weight="700" fill="#f3f4f6">LangGraph Research &amp; Math Agent</text>
  <text x="96" y="184" font-size="16" fill="#d1d5db">This agent can <tspan font-weight="700" fill="#f3f4f6">search the live internet</tspan> and <tspan font-weight="700" fill="#f3f4f6">solve complex math</tspan>. Watch its thought process!</text>

  <!-- msg 1 user -->
  <rect x="96" y="206" width="1088" height="48" rx="10" fill="#161c24"/>
  <rect x="108" y="214" width="32" height="32" rx="8" fill="#ef4444"/>
  <circle cx="124" cy="226" r="5" fill="#fef2f2"/><path d="M114 242 a10 8 0 0 1 20 0 z" fill="#fef2f2"/>
  <text x="156" y="236" font-size="16" fill="#e5e7eb">What is 234 * 87 / 3?</text>

  <!-- msg 1 assistant -->
  <rect x="108" y="266" width="32" height="32" rx="8" fill="#f59e0b"/>
  <rect x="115" y="275" width="18" height="14" rx="3" fill="#2a1f0b"/><circle cx="120" cy="282" r="2" fill="#fbbf24"/><circle cx="128" cy="282" r="2" fill="#fbbf24"/>
  <text x="156" y="288" font-size="16" fill="#e5e7eb">234 * 87 / 3 equals <tspan font-weight="700" fill="#f3f4f6">6786</tspan>.</text>

  <!-- msg 2 user -->
  <rect x="96" y="314" width="1088" height="48" rx="10" fill="#161c24"/>
  <rect x="108" y="322" width="32" height="32" rx="8" fill="#ef4444"/>
  <circle cx="124" cy="334" r="5" fill="#fef2f2"/><path d="M114 350 a10 8 0 0 1 20 0 z" fill="#fef2f2"/>
  <text x="156" y="344" font-size="16" fill="#e5e7eb">Find the current population of Tokyo and calculate 15% of it.</text>

  <!-- msg 2 assistant -->
  <rect x="108" y="374" width="32" height="32" rx="8" fill="#f59e0b"/>
  <rect x="115" y="383" width="18" height="14" rx="3" fill="#2a1f0b"/><circle cx="120" cy="390" r="2" fill="#fbbf24"/><circle cx="128" cy="390" r="2" fill="#fbbf24"/>

  <!-- expander: web_search -->
  <rect x="156" y="374" width="1028" height="150" rx="10" fill="#0f141a" stroke="#2a323d"/>
  <rect x="172" y="388" width="16" height="16" rx="4" fill="#0c2233" stroke="#075985"/>
  <circle cx="179" cy="395" r="3.5" fill="none" stroke="#7dd3fc" stroke-width="1.5"/><line x1="182" y1="398" x2="185" y2="401" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="198" y="401" font-size="15" font-weight="600" fill="#e5e7eb">Using Tool: <tspan fill="#7dd3fc">web_search</tspan></text>
  <path d="M1156 400 l6 -6 l6 6" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="172" y="416" width="996" height="94" rx="8" fill="#161c24"/>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#d1d5db">
    <text x="188" y="442">Tokyo, the capital of Japan, has a population of roughly 14 million people in the</text>
    <text x="188" y="464">metropolis proper, while the Greater Tokyo Area is home to around 37 million residents,</text>
    <text x="188" y="486">making it the most populous metropolitan area in the world ...</text>
  </g>

  <!-- expander: Calculator -->
  <rect x="156" y="536" width="1028" height="100" rx="10" fill="#0f141a" stroke="#2a323d"/>
  <rect x="172" y="550" width="16" height="16" rx="4" fill="#2a1f0b" stroke="#92400e"/>
  <text x="180" y="563" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24">=</text>
  <text x="198" y="563" font-size="15" font-weight="600" fill="#e5e7eb">Using Tool: <tspan fill="#fbbf24">Calculator</tspan></text>
  <path d="M1156 562 l6 -6 l6 6" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="172" y="578" width="996" height="44" rx="8" fill="#161c24"/>
  <text x="188" y="605" font-family="Consolas, Menlo, monospace" font-size="13" fill="#d1d5db">2100000.0</text>

  <!-- final answer -->
  <text x="156" y="666" font-size="16" fill="#e5e7eb">Tokyo has a population of roughly <tspan font-weight="700" fill="#f3f4f6">14 million</tspan> people. 15% of that is <tspan font-weight="700" fill="#4ade80">2,100,000</tspan>.</text>

  <!-- chat input -->
  <rect x="96" y="690" width="1088" height="48" rx="12" fill="#161c24" stroke="#2a323d"/>
  <text x="120" y="720" font-size="15" fill="#6b7280">Ask me to search the web or solve a math problem...</text>
  <rect x="1140" y="700" width="32" height="28" rx="8" fill="#1e2630"/>
  <path d="M1149 714 h14 M1157 708 l6 6 l-6 6" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
